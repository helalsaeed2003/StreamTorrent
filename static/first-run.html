<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>StreamTorrent Setup</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #1e1e1e;
      color: #eee;
      font-family: Segoe UI, Helvetica Neue, sans-serif;
      font-size: 14px;
      user-select: none;
      overflow: hidden;
    }

    .page {
      display: flex;
      flex-direction: column;
      height: 100%;
      box-sizing: border-box;
    }

    .head {
      padding: 16px 20px 12px;
      border-bottom: 1px solid #333;
    }

    .head h1 {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 600;
    }

    .head p {
      margin: 0;
      font-size: 12px;
      opacity: 0.7;
    }

    .body {
      flex: 1;
      padding: 16px 20px;
      overflow: auto;
    }

    .body > p {
      margin: 0 0 14px;
      opacity: 0.85;
    }

    label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 7px 0;
      cursor: pointer;
    }

    label input {
      margin: 2px 0 0;
      width: 15px;
      height: 15px;
      accent-color: #4a90d9;
      cursor: pointer;
    }

    label span {
      line-height: 1.35;
    }

    label small {
      display: block;
      opacity: 0.6;
      font-size: 12px;
    }

    .foot {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 12px 20px;
      border-top: 1px solid #333;
      background: #242424;
    }

    button {
      min-width: 96px;
      padding: 7px 14px;
      font-family: inherit;
      font-size: 13px;
      color: #eee;
      background: #3a3a3a;
      border: 1px solid #555;
      border-radius: 3px;
      cursor: pointer;
    }

    button:hover {
      background: #454545;
    }

    button.primary {
      background: #4a90d9;
      border-color: #4a90d9;
      color: #fff;
    }

    button.primary:hover {
      background: #5b9ee1;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="head">
      <h1>Select Additional Tasks</h1>
      <p>Which additional tasks should be performed?</p>
    </div>

    <div class="body">
      <p>Select the additional tasks you would like to perform for StreamTorrent,
        then click Finish.</p>

      <label>
        <input type="checkbox" id="desktop">
        <span>Create a desktop shortcut</span>
      </label>

      <label>
        <input type="checkbox" id="startMenu">
        <span>Create a Start menu shortcut</span>
      </label>

      <label>
        <input type="checkbox" id="fileHandler">
        <span>Open torrent files and magnet links with StreamTorrent
          <small>Takes them over from whatever opens them now. You can give
            them back at any time from Windows' own Default apps
            screen.</small></span>
      </label>
    </div>

    <div class="foot">
      <button class="primary" id="finish">Finish</button>
    </div>
  </div>
  <script>require('./first-run.js')</script>
</body>
</html>
