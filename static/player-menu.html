<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>StreamTorrent menu</title>
  <style>
    @font-face {
      font-family: 'Material Icons';
      font-style: normal;
      font-weight: 400;
      src: url('MaterialIcons-Regular.woff2') format('woff2');
    }

    .icon {
      font-family: 'Material Icons';
      font-weight: normal;
      font-style: normal;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
    }
  </style>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: Segoe UI, Helvetica Neue, sans-serif;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.9);
      user-select: none;
      cursor: default;
    }

    .panel {
      background: rgba(32, 32, 32, 0.96);
      border-radius: 6px;
      padding: 8px 0;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
      overflow-y: auto;
      max-height: 100vh;
    }

    .heading {
      padding: 4px 14px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      white-space: nowrap;
    }

    .row.pick:hover {
      background: rgba(255, 255, 255, 0.1);
      cursor: pointer;
    }

    .row .label {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row .icon {
      font-size: 17px;
      opacity: 0.85;
      flex: none;
    }

    .divider {
      height: 1px;
      margin: 6px 0;
      background: rgba(255, 255, 255, 0.12);
    }

    .value {
      text-align: center;
      font-size: 22px;
      font-weight: 600;
      padding: 2px 0 6px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 2px 14px 8px;
    }

    input[type=range] {
      -webkit-appearance: none;
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.3);
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    .step {
      width: 26px;
      height: 26px;
      flex: none;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
    }

    .step:hover {
      background: rgba(255, 255, 255, 0.26);
    }

    .chips {
      display: flex;
      flex-wrap: nowrap;
      justify-content: space-between;
      gap: 4px;
      padding: 2px 14px 10px;
    }

    .chip {
      border: none;
      border-radius: 13px;
      padding: 5px 11px;
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.9);
      font-size: 12px;
      cursor: pointer;
    }

    .chip:hover {
      background: rgba(255, 255, 255, 0.24);
    }

    .chip.on {
      background: #ff4081;
      color: #fff;
    }

    .nudge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 2px 14px 8px;
    }

    .nudge .amount {
      flex: 1;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
    }

    .nudge button {
      border: none;
      border-radius: 4px;
      padding: 5px 7px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }

    .nudge button:hover {
      background: rgba(255, 255, 255, 0.26);
    }

    .wide {
      display: block;
      width: calc(100% - 28px);
      margin: 0 14px 8px;
      border: none;
      border-radius: 4px;
      padding: 6px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }

    .wide:hover {
      background: rgba(255, 255, 255, 0.26);
    }
  </style>
</head>
<body>
  <div class="panel" id="panel"></div>
  <script>
    const { ipcRenderer } = require('electron')

    const panel = document.getElementById('panel')

    // Speeds offered as one-tap buttons, as well as on the slider
    const SPEED_CHIPS = [0.5, 1, 1.25, 1.5, 2, 3]

    // A slider being dragged must not be drawn again under the pointer. Every
    // move sends the new value to the player, which sends the menu its state
    // back, and redrawing then threw away the very element being dragged: the
    // handle jumped to where the drag started and stayed there. While a drag
    // is on, the new state is kept and drawn once the handle is let go.
    let dragging = 0
    let pending = null

    ipcRenderer.on('player-menu-data', (e, data) => {
      if (dragging > 0) {
        pending = data
        return
      }
      render(data)
    })

    function holdRender () {
      dragging++
    }

    function releaseRender () {
      if (dragging === 0) return
      dragging = 0
      if (pending) {
        const data = pending
        pending = null
        render(data)
      }
    }

    window.addEventListener('pointerup', releaseRender)
    window.addEventListener('pointercancel', releaseRender)
    window.addEventListener('blur', releaseRender)

    function act (action, ...args) {
      ipcRenderer.send('player-menu-action', action, args)
    }

    // The window is made exactly as tall as what is in it
    function measure () {
      const height = Math.ceil(panel.getBoundingClientRect().height)
      ipcRenderer.send('player-menu-height', height)
    }

    function el (tag, className, text) {
      const node = document.createElement(tag)
      if (className) node.className = className
      if (text != null) node.textContent = text
      return node
    }

    function heading (text) {
      return el('div', 'heading', text)
    }

    function divider () {
      return el('div', 'divider')
    }

    // A row that picks something, with a radio mark when it is a choice
    function pick (label, selected, onClick, iconName) {
      const row = el('div', 'row pick')
      const icon = el('i', 'icon')
      icon.textContent = iconName ||
        (selected ? 'radio_button_checked' : 'radio_button_unchecked')
      row.appendChild(icon)
      row.appendChild(el('span', 'label', label))
      row.addEventListener('click', onClick)
      return row
    }

    function slider (min, max, step, value, onInput) {
      const input = document.createElement('input')
      input.type = 'range'
      input.min = min
      input.max = max
      input.step = step
      input.value = value
      input.addEventListener('input', () => onInput(Number(input.value)))
      input.addEventListener('pointerdown', holdRender)
      input.addEventListener('keydown', holdRender)
      input.addEventListener('keyup', releaseRender)
      return input
    }

    function chips (values, current, format, onPick) {
      const box = el('div', 'chips')
      values.forEach(value => {
        const chip = el('button', 'chip' + (value === current ? ' on' : ''), format(value))
        chip.addEventListener('click', () => onPick(value))
        box.appendChild(chip)
      })
      return box
    }

    function render (data) {
      panel.innerHTML = ''
      if (data.kind === 'speed') renderSpeed(data)
      else if (data.kind === 'subtitles') renderSubtitles(data)
      else if (data.kind === 'audio') renderAudio(data)
      else if (data.kind === 'cast') renderCast(data)
      measure()
    }

    function renderSpeed (data) {
      const rate = Number(data.rate) || 1

      panel.appendChild(heading('Playback speed'))
      // Updated as the slider moves, since the menu is not drawn again while a
      // handle is being dragged
      const readout = el('div', 'value', rate.toFixed(2) + 'x')
      panel.appendChild(readout)

      const row = el('div', 'slider-row')
      const minus = el('button', 'step', '−')
      minus.addEventListener('click', () => setRate(rate - 0.05))
      const plus = el('button', 'step', '+')
      plus.addEventListener('click', () => setRate(rate + 0.05))
      row.appendChild(minus)
      row.appendChild(slider(0.25, 4, 0.05, rate, setRate))
      row.appendChild(plus)
      panel.appendChild(row)

      panel.appendChild(chips(SPEED_CHIPS, rate,
        value => value + 'x', setRate))

      function setRate (value) {
        const clamped = Math.round(Math.max(0.25, Math.min(4, value)) * 100) / 100
        readout.textContent = clamped.toFixed(2) + 'x'
        act('setPlaybackRate', clamped)
      }
    }

    function renderSubtitles (data) {
      const tracks = data.tracks || []
      const files = data.files || []

      if (tracks.length > 0) {
        panel.appendChild(heading('Built into the video'))
        tracks.forEach((track, ix) => {
          panel.appendChild(pick(track.label, data.selectedIndex === ix,
            () => act('selectSubtitle', ix)))
        })
      }

      if (files.length > 0) {
        panel.appendChild(heading('Subtitle files'))
        files.forEach(file => {
          panel.appendChild(pick(file.name, false,
            () => act('selectTorrentSubtitle', file.index),
            file.pending ? 'hourglass_empty' : 'subtitles'))
        })
      }

      panel.appendChild(pick('Off', data.selectedIndex === -1,
        () => act('selectSubtitle', -1)))
      panel.appendChild(pick('Load from my computer…', false,
        () => act('openSubtitles'), 'folder_open'))

      panel.appendChild(divider())
      panel.appendChild(heading('Timing'))

      const delay = Number(data.delay) || 0
      const nudge = el('div', 'nudge')
      const amounts = [-0.1, -0.01, 0.01, 0.1]
      amounts.forEach((amount, i) => {
        const button = el('button', null,
          (amount > 0 ? '+' : '−') + Math.abs(amount) + 's')
        button.addEventListener('click',
          () => act('setSubtitleDelay', Math.round((delay + amount) * 100) / 100))
        if (i === 2) {
          nudge.appendChild(el('div', 'amount', formatDelay(delay)))
        }
        nudge.appendChild(button)
      })
      panel.appendChild(nudge)

      const reset = el('button', 'wide', 'Reset timing')
      reset.addEventListener('click', () => act('setSubtitleDelay', 0))
      panel.appendChild(reset)

      panel.appendChild(divider())
      panel.appendChild(heading('Size'))

      const scale = Math.round((Number(data.scale) || 1) * 100)
      const sizeReadout = el('div', 'value', scale + '%')
      panel.appendChild(sizeReadout)

      const sizeRow = el('div', 'slider-row')
      const smaller = el('button', 'step', '−')
      smaller.addEventListener('click', () => setScale(scale - 5))
      const bigger = el('button', 'step', '+')
      bigger.addEventListener('click', () => setScale(scale + 5))
      sizeRow.appendChild(smaller)
      sizeRow.appendChild(slider(50, 300, 5, scale, setScale))
      sizeRow.appendChild(bigger)
      panel.appendChild(sizeRow)

      function setScale (value) {
        const clamped = Math.max(50, Math.min(300, Math.round(value)))
        sizeReadout.textContent = clamped + '%'
        act('setSubtitleScale', clamped / 100)
      }
    }

    function renderAudio (data) {
      const tracks = data.tracks || []
      panel.appendChild(heading('Audio track'))
      tracks.forEach((track, ix) => {
        panel.appendChild(pick(track.label, data.selectedIndex === ix,
          () => act('selectAudioTrack', ix)))
      })
    }

    function renderCast (data) {
      panel.appendChild(heading('Play on'))
      ;(data.devices || []).forEach((device, ix) => {
        panel.appendChild(pick(device.label, device.selected,
          () => act('selectCastDevice', ix)))
      })
    }

    // "+0.40s" / "-1.20s" / "0s"
    function formatDelay (delay) {
      if (!delay) return '0s'
      return (delay > 0 ? '+' : '−') + Math.abs(delay).toFixed(2) + 's'
    }

    window.addEventListener('resize', measure)
  </script>
</body>
</html>
