<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>StreamTorrent player bars</title>
  <link rel="stylesheet" href="main.css">
  <style>
    /*
     * One bar per window, each window only as tall as its bar. The window
     * itself is made see-through with setOpacity, so what is drawn here is
     * solid.
     */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #101010;
    }

    /* The window is the bar, so the controls themselves add no shade of their
       own: the few pixels above them are the seek bar's headroom, not a second
       bar over the picture */
    .player .controls {
      background: transparent;
    }

    .chrome-header {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 100%;
      padding: 0 12px;
      box-sizing: border-box;
      color: #eee;
      font-family: Segoe UI, Helvetica Neue, sans-serif;
      font-size: 14px;
    }

    .chrome-header .icon {
      cursor: pointer;
      font-size: 22px;
      opacity: 0.9;
      position: static;
      top: auto;
    }

    .chrome-header .title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.9;
    }

    /* The time shown while the pointer runs along the seek bar. It sits inside
       the bar, under the pointer, so nothing has to stick out over the video */
    .player .controls .scrub-preview {
      position: absolute;
      bottom: 7px;
      width: 60px;
      height: 22px;
      line-height: 22px;
      margin-left: -30px;
      text-align: center;
      color: #fff;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      background: rgba(0, 0, 0, 0.82);
      border-radius: 3px;
      pointer-events: none;
      font-family: Segoe UI, Helvetica Neue, sans-serif;
    }
  </style>
</head>
<body>
  <div class="app view-player is-win32" id="app">
    <div class="player mpv-player">
      <div class="chrome-header" id="header">
        <i class="icon" id="back" title="Back to the list">chevron_left</i>
        <span class="title" id="title"></span>
      </div>
      <div class="controls" id="controls"></div>
    </div>
  </div>
  <script>require('./player-chrome.js')</script>
</body>
</html>
