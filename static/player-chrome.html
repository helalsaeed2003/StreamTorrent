<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>StreamTorrent player bars</title>
  <link rel="stylesheet" href="main.css">
  <style>
    /*
     * One bar per window, each window only as tall as its bar. The window
     * itself is made see-through with setOpacity, so what is drawn here is
     * solid.
     */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #101010;
    }

    /* The window is the bar, so the controls themselves add no shade of their
       own: the few pixels above them are the seek bar's headroom, not a second
       bar over the picture */
    .player .controls {
      background: transparent;
    }

    .chrome-header {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 100%;
      padding: 0 12px;
      box-sizing: border-box;
      color: #eee;
      font-family: Segoe UI, Helvetica Neue, sans-serif;
      font-size: 14px;
    }

    .chrome-header .icon {
      cursor: pointer;
      font-size: 22px;
      opacity: 0.9;
      position: static;
      top: auto;
    }

    .chrome-header .title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.9;
    }

    /*
     * The seek bar runs flush along the top edge of the window, so the bar
     * stops where the picture starts and no dark strip stands above it.
     */
    .player .controls .loading-bar {
      top: -6px;
      height: 6px;
      background-color: rgba(255, 255, 255, 0.18);
    }

    .player .controls .playback-cursor {
      top: -6px;
      width: 6px;
      height: 6px;
      margin-left: -3px;
    }

    /*
     * The bar thickens under the pointer by growing downwards, into itself, so
     * its top edge never moves and the bar never changes size.
     */
    .player .playback-bar:hover .loading-bar {
      top: -6px;
      height: 10px;
    }

    .player .playback-bar:hover .playback-cursor {
      top: -6px;
      margin-left: -6px;
      width: 12px;
      height: 12px;
    }

    /*
     * The time under the pointer, in a window of its own above the bar. Its
     * window is see-through, so only the label itself is drawn.
     */
    body.part-preview {
      background: transparent;
    }

    .scrub-tip {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 26px;
      line-height: 26px;
      text-align: center;
      color: #fff;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      font-family: Segoe UI, Helvetica Neue, sans-serif;
      background: rgba(24, 24, 24, 0.62);
      border-radius: 4px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
    }

    /* The offer to jump to where the video was left off */
    body.part-resume {
      background: transparent;
    }

    .resume-offer {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 36px;
      padding: 0 8px 0 14px;
      box-sizing: border-box;
      color: #eee;
      font-family: Segoe UI, Helvetica Neue, sans-serif;
      font-size: 13px;
      background: rgba(24, 24, 24, 0.86);
      border-radius: 4px;
    }

    .resume-offer-text {
      white-space: nowrap;
    }

    .resume-offer-action {
      cursor: pointer;
      white-space: nowrap;
      color: #4a90d9;
      font-weight: 600;
    }

    .resume-offer-action:hover {
      color: #6aa8e6;
    }

    .resume-offer-close {
      cursor: pointer;
      font-size: 18px;
      opacity: 0.6;
      margin-left: auto;
      position: static;
      top: auto;
    }

    .resume-offer-close:hover {
      opacity: 1;
    }

    /* The point at the bottom, resting on the seek bar */
    .scrub-tip::after {
      content: '';
      position: absolute;
      top: 26px;
      left: 50%;
      margin-left: -6px;
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 7px solid rgba(24, 24, 24, 0.62);
    }
  </style>
</head>
<body>
  <div class="app view-player is-win32" id="app">
    <div class="player mpv-player">
      <div class="chrome-header" id="header">
        <i class="icon" id="back" title="Back to the list">chevron_left</i>
        <span class="title" id="title"></span>
      </div>
      <div class="controls" id="controls"></div>
    </div>
  </div>
  <div class="scrub-tip" id="tip"></div>
  <div class="resume-offer" id="resume">
    <span class="resume-offer-text" id="resume-text"></span>
    <span class="resume-offer-action" id="resume-go">Continue from there</span>
    <i class="icon resume-offer-close" id="resume-close">close</i>
  </div>
  <script>require('./player-chrome.js')</script>
</body>
</html>
