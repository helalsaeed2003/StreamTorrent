<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>StreamTorrent player bars</title>
  <link rel="stylesheet" href="main.css">
  <style>
    /*
     * One bar per window, each window only as tall as its bar. The window
     * itself is made see-through with setOpacity, so what is drawn here is
     * solid.
     */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #101010;
    }

    body.part-controls {
      /* The strip above the controls, where the time shows while scrubbing,
         belongs to the picture rather than to the bar */
      background: transparent;
    }

    .player .controls {
      background: #101010;
    }

    .chrome-header {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 100%;
      padding: 0 12px;
      box-sizing: border-box;
      color: #eee;
      font-family: Segoe UI, Helvetica Neue, sans-serif;
      font-size: 14px;
    }

    .chrome-header .icon {
      cursor: pointer;
      font-size: 22px;
      opacity: 0.9;
      position: static;
      top: auto;
    }

    .chrome-header .title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.9;
    }

    /* The time shown while the pointer runs along the seek bar */
    .player .controls .scrub-preview {
      position: absolute;
      bottom: 46px;
      width: 86px;
      text-align: center;
      color: #eee;
      font-size: 13px;
      text-shadow: 0 0 2px rgba(0, 0, 0, 0.6);
      font-family: Segoe UI, Helvetica Neue, sans-serif;
    }
  </style>
</head>
<body>
  <div class="app view-player is-win32" id="app">
    <div class="player mpv-player">
      <div class="chrome-header" id="header">
        <i class="icon" id="back" title="Back to the list">chevron_left</i>
        <span class="title" id="title"></span>
      </div>
      <div class="controls" id="controls"></div>
    </div>
  </div>
  <script>require('./player-chrome.js')</script>
</body>
</html>
